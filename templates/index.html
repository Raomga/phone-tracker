<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis teléfonos — Rastreador</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header {
      padding: 12px 16px; background: #111827; color: #f9fafb;
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    header small { color: #9ca3af; }
    #layout { display: flex; height: calc(100vh - 58px); }
    #map { flex: 1; }
    #sidebar {
      width: 320px; max-width: 85vw; overflow-y: auto;
      border-left: 1px solid #e5e7eb; background: #f9fafb; padding: 12px;
    }
    .device-card {
      background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
      padding: 10px 12px; margin-bottom: 10px;
    }
    .device-card h2 { margin: 0 0 4px; font-size: 1rem; }
    .device-card .meta { font-size: .85rem; color: #4b5563; line-height: 1.5; }
    .device-card .stale { color: #b45309; font-weight: 600; }
    #status { font-size: .8rem; color: #9ca3af; }
    @media (max-width: 700px) {
      #layout { flex-direction: column; }
      #sidebar { width: 100%; border-left: none; border-top: 1px solid #e5e7eb; max-height: 40%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>📍 Mis teléfonos</h1>
      <small id="status">Cargando…</small>
    </div>
    <div><button id="refreshBtn" type="button">Actualizar ahora</button></div>
  </header>

  <div id="layout">
    <div id="map"></div>
    <aside id="sidebar"><p>Cargando teléfonos…</p></aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const map = L.map('map').setView([19.43, -99.13], 5); // CDMX por defecto
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);

    const markers = {};
    const STALE_MINUTES = 30;

    function timeAgo(iso) {
      const diffMs = Date.now() - new Date(iso).getTime();
      if (isNaN(diffMs)) return 'fecha desconocida';
      const min = Math.floor(diffMs / 60000);
      if (min < 1) return 'hace menos de un minuto';
      if (min < 60) return `hace ${min} min`;
      const h = Math.floor(min / 60);
      if (h < 24) return `hace ${h} h ${min % 60} min`;
      return `hace ${Math.floor(h / 24)} d`;
    }

    function fmtLatLon(lat, lon) {
      return `${lat.toFixed(5)}, ${lon.toFixed(5)}`;
    }

    async function loadPositions() {
      const statusEl = document.getElementById('status');
      const sidebar = document.getElementById('sidebar');
      try {
        const res = await fetch('/api/positions');
        const data = await res.json();
        const devices = data.devices || {};
        const names = Object.keys(devices);

        statusEl.textContent =
          names.length === 0
            ? 'Sin teléfonos registrados todavía'
            : `${names.length} teléfono(s) · actualizado ${new Date().toLocaleTimeString()}`;

        sidebar.innerHTML = '';
        if (names.length === 0) {
          sidebar.innerHTML = '<p>Aún no hay reportes. Configura GPSLogger en tus teléfonos apuntando a <code>/api/report</code>.</p>';
        }

        const bounds = [];
        for (const name of names) {
          const p = devices[name];
          const stale = (Date.now() - new Date(p.received_at || p.time).getTime()) > STALE_MINUTES * 60000;
          const batt = p.battery != null ? ` · batería ${p.battery}%` : '';

          if (markers[name]) {
            markers[name].setLatLng([p.lat, p.lon]);
          } else {
            markers[name] = L.marker([p.lat, p.lon]).addTo(map)
              .bindPopup(`<strong>${escapeHtml(name)}</strong>`);
          }

          const card = document.createElement('div');
          card.className = 'device-card';
          card.innerHTML =
            `<h2>${escapeHtml(name)}</h2>
             <div class="meta">
               📍 ${fmtLatLon(p.lat, p.lon)}<br>
               🕒 ${timeAgo(p.received_at || p.time)}${stale ? ' <span class="stale">(sin actualizar)</span>' : ''}${batt}<br>
               <a href="https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=16/${p.lat}/${p.lon}" target="_blank" rel="noopener">Ver en OpenStreetMap</a>
             </div>`;
          card.addEventListener('click', () => map.flyTo([p.lat, p.lon], 15));
          sidebar.appendChild(card);
          bounds.push([p.lat, p.lon]);
        }

        // Elimina marcadores de teléfonos que ya no existen
        for (const name of Object.keys(markers)) {
          if (!devices[name]) { map.removeLayer(markers[name]); delete markers[name]; }
        }

        if (bounds.length > 0) map.fitBounds(bounds, { padding: [40, 40] });
      } catch (err) {
        statusEl.textContent = 'Error al cargar posiciones: ' + err.message;
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    document.getElementById('refreshBtn').addEventListener('click', loadPositions);
    loadPositions();
    setInterval(loadPositions, 30000); // refresco automático cada 30 s
  </script>
</body>
</html>
